spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  email:
    remetente: ${EMAIL_REMETENTE}
    senha: ${EMAIL_SENHA}

  admin:
    email: ${EMAIL_ADMIN}
    senha: ${SENHA_ADMIN}